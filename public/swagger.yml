openapi: 3.0.0
info:
  title: Proxy API
  version: 1.0.0
  description: Proxy service for WakaTime and GitHub APIs

servers:
  - url: https://proxy.yappii.my.id/api
  - url: http://localhost:3000/api

tags:
  - name: Wakatime
    description: Sign Up to wakatime and go to setting [https://wakatime.com/settings/account](https://wakatime.com/settings/account) and copy `Your Secret API Key`

components:
  securitySchemes:
    WakaTimeToken:
      type: apiKey
      in: header
      name: x-api-token
      description: WakaTime Secret API Key. Get from [https://wakatime.com/settings/account](https://wakatime.com/settings/account)
  
  responses:
    SuccessResponse:
        description: Success
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                errors:
                  type: array
    UnauthorizedError:
      description: Token required
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Missing API token
              data:
                type: object
                example: null
              errors:
                type: array
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                type: object
                example: null
              errors:
                type: array
    InputValidation:
      description: Input validation
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                type: object
                example: null
              errors:
                type: array
                example:
                  - Parameter range is required

paths:
  /wakatime/stats/{range}:
    get:
      summary: Get WakaTime stats
      description: |
        Require `x-api-token` header with your WakaTime Secret API Key.
        
        Get token from: https://wakatime.com/settings/account
        
        Path parameter `range` is required (valid values: today, yesterday, last_7_days, last_30_days, last_6_months, last_year).
      tags: 
        - Wakatime
      parameters:
        - name: range
          in: path
          required: true
          schema:
            type: string
            enum: [all_time, last_days, last_30_days, last_6_months, last_year]
      security:
        - WakaTimeToken: []
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse'
        400:
          $ref: '#/components/responses/InputValidation'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /wakatime/languages:
    get:
      summary: Get WakaTime languages
      description: |
        Require `x-api-token` header with your WakaTime Secret API Key.
        
        Get token from: https://wakatime.com/settings/account
      tags:
        - Wakatime
      security:
        - WakaTimeToken: []
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /wakatime/time:
    get:
      summary: Get WakaTime user time
      description: |
        Require `x-api-token` header with your WakaTime Secret API Key.
        
        Get token from: https://wakatime.com/settings/account
      tags:
        - Wakatime
      security:
        - WakaTimeToken: []
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
