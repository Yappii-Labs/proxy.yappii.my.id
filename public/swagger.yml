      security:
        - WakaTimeToken: []
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /wakatime/projects:
