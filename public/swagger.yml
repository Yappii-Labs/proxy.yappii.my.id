  /wakatime/summaries:
    get:
      summary: Get WakaTime summaries
      description: |
        Require `x-api-token` header with your WakaTime Secret API Key.
        
        Get token from: https://wakatime.com/settings/account
        
        Optional query parameters: `start` and `end` (date format).
      tags:
        - Wakatime
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: string
        - name: end
          in: query
          required: false
          schema:
            type: string
      security:
        - WakaTimeToken: []
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /wakatime/all-time-since-today:
    get:
      summary: Get WakaTime all time since today
      description: |
        Require `x-api-token` header with your WakaTime Secret API Key.
        
        Get token from: https://wakatime.com/settings/account
      tags:
        - Wakatime
      security:
        - WakaTimeToken: []
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /wakatime/goals:
