name: DEV-DEPLOY/@vercel

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - staging

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: '@checkout/code'
        uses: actions/checkout@v4

      - name: '@setup/pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: '@setup/node.js'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      
      - name: '@pnpm/approve-builds'
        run: pnpm approve-builds --yes

      - name: '@npm/install-dependencies'
        run: pnpm install --frozen-lockfile

      - name: '@npm/install-vercel-cli'
        run: npm install -g vercel@latest

      - name: '@vercel/pull'
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: '@vercel/build'
        run: |
          vercel build \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: '@vercel/deploy'
        run: |
          vercel deploy \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }}